[package]
name = "auri-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Offline terminal control for the Kuba Auri (CB5100) DSP cable"
keywords = ["hid", "dsp", "equalizer", "tui"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "auri"
path = "src/main.rs"

[dependencies]
auri-codec = { path = "../auri-codec" }
auri-gate = { path = "../auri-gate" }
auri-policy = { path = "../auri-policy" }
auri-transport = { path = "../auri-transport" }
clap = { version = "4.5", features = ["derive"] }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
